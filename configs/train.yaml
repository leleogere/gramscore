# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data@pretraining_data: pdmx_tokens_datamodule
  - data: asap_tokens_datamodule
  - model: tokens_transcriber_module
  - callbacks: default
  - trainer@pretrainer: cpu
  - trainer: cpu
  - logger: wandb
  - paths: default

pretrainer:
    max_steps: 10

trainer:
    max_steps: 15

log_level: DEBUG

tags: ["dev"]
