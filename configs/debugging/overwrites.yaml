# Train mixed
#data:
#    batch_size: 5

model:
  #    load_from_checkpoint: /home/gerel/Documents/transcription/gramscore2/outputs/server/2026-04-10_10-22-43.482544_worldly-energy-399/checkpoints/last.ckpt
  tokens_positions_scaling_factor: 1.0
  #    num_hidden_layers: 2
  scheduler:
    warmup_steps: 1
  experts_inner_dims:
    _default: [ 256, 128 ]
  #    chunk_size_scheduler@cfg.model.generic_scheduler: linear_ramp  # How to make this work?
  #    chunk_size_scheduler:
  #        _target_: src.models.generic_scheduler.linear_ramp.LinearRamp
  #        coefficient: 25  # Should reach 500 by 20 steps
  #        clamp_min: 50
  #        clamp_max: 500
  #        cast_type: int
  full_eval_every_n_val_steps: 1
  full_eval_max_batches: 3
  time_based_cross_attention: false
  loss_weights:
    Note:
      note_class: 10.0
      note_octave: 10.0
      note_accidental: 10.0
  states_prediction: true
  states_prediction_mlp_dims: [ 128, 30, 30 ]
  states_prediction_loss_weight: 1.0
  state_num_voices: 8
#    latent_part_reserved_for_router: 0.5

callbacks:
  model_checkpoint:
    every_n_train_steps: 1

tags: [ "debugging" ]

log_level: DEBUG