# @package _global_
trainer:
  max_steps: 30_000
  check_val_every_n_epoch: 50  # nothing
  val_check_interval: null  # 20
  log_every_n_steps: 1
  overfit_batches: 1
#    reload_dataloaders_every_n_epochs: 1

# Pretrain PDMX
data:
  allowed_staffs: [ 1 ]
  validation_pieces_filename: validation_pieces_single_staff_unique.txt
  test_pieces_filename: test_pieces_single_staff_unique.txt
  batch_size: 1
  test_validation_mode: "first_chunk"
  include_states: true
  state_num_voices: 8

