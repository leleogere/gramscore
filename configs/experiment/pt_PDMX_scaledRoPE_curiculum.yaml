# @package _global_
defaults:
    - /data: pdmx_tokens_datamodule

data:
    batch_size: 48
    num_workers: 20

model:
    tokens_positions_scaling_factor: 17.0
    #full_eval_every_n_val_steps: 100000000  # Disable for now as crashing on GPU
    #full_eval_max_batches: 3
    chunk_size_scheduler:  # How to specify that directly with the config file?
        _target_: src.models.generic_scheduler.linear_ramp.LinearRamp
        coefficient: 0.005  # Should reach 500 by 100k steps
        clamp_min: 50
        clamp_max: 500
        cast_type: int

trainer:
    val_check_interval: 1000
    log_every_n_steps: 200
    max_steps: 1_000_000
    reload_dataloaders_every_n_epochs: 1


