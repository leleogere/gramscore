# @package _global_
defaults:
    - /data: pdmx_tokens_datamodule

data:
    batch_size: 48
    num_workers: 20

model:
    positional_encoder:
        shortest_period: 0.1
    time_based_cross_attention: false
    expert_loss_weight: 0.1
    tokens_positions_scaling_factor: 1.0
    full_eval_every_n_val_steps: 20
    full_eval_max_batches: 10

trainer:
    val_check_interval: 1000
    log_every_n_steps: 200
    max_steps: 1_000_000
