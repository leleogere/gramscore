_target_: src.data.pdmx_tokens_datamodule.PdmxTokensDataModule

defaults:
    - _self_

data_dir:
    _target_: pathlib.Path
    _args_:
        - ${paths.data_dir}/pdmx

asap_path:
    _target_: pathlib.Path
    _args_:
        - ${paths.data_dir}/asap-dataset

rating_oversampler_config: null
#    _target_: src.data.pdmx_tokens_datamodule.RatingOversamplerConfig
#    min_rating_to_consider_good: 4.0
#    min_n_ratings_to_consider_good: 3
#    objective_percentage: 0.5

validation_pieces_filename: validation_pieces.txt

batch_size: 2
num_workers: 2
prefetch_factor: 2
persistent_workers: true
pin_memory: false

test_validation_mode: first_chunk

use_cache: False