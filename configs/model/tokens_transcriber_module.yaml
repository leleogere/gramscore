_target_: src.models.tokens_transcriber_module.TokensTranscriberModule

defaults:
    - optimizer: adamw
    - scheduler: warmup_cosine_scheduler
    - positional_encoder: finer_positional_encoder
    - chunk_size_scheduler@generic_scheduler: null

embedding_dim: 512
num_hidden_layers: 4
num_attention_heads: 8
intermediate_size: 1536
hidden_dropout_prob: 0.1
layer_norm_eps: 1e-12
max_position_embeddings: 8192
experts_inner_dims: [256, 128]
expert_loss_weight: 0.01
performance_dropout: 0.0
score_dropout: 0.0
log_logits_each_n_val_steps: 10
val_max_logits_logged: 5
scale_expert_losses_with_token_frequency: false
tokens_positions_scaling_factor: 1.0
full_eval_every_n_val_steps: 5
full_eval_max_batches: null

load_from_checkpoint: ""