[project]
name = "gramscore"
version = "0.0.1"
description = "Describe Your Cool Project"
authors = [
    { name = "Léo Géré", email = "leleogere@gmail.com" }
]
urls = { "Homepage" = "https://github.com/leleogere/gramscore" }
requires-python = "==3.11.*"
dependencies = [
    #    'Pillow',
    #    'accelerate',
    #    'bitsandbytes',
    #    'cairosvg',
    'python-dotenv',
    'einops',
    'hydra-colorlog>=1.2.0',
    "hydra-core>=1.3.2",
    'joblib',
    'lightning>=2.0.0',
    'loguru',
    'matplotlib',
    'pandas',
    #    'partitura @ git+https://github.com/leleogere/partitura.git@develop_perso',
    #    'peft',
    'positional-encodings',
    'pretty_midi',
    'rich',
    #    'sentencepiece',
    'symusic',
    'torch>=2.0.0',
    'torchmetrics>=0.11.4',
    #    'torchvision>=0.15.0',
    'tqdm',
    'transformers==4.53.3',
    'verovio',
    'wandb>=0.26.0',
    'wandb-osh',
    # NUMBA
    # ScoreTransformer
    # Muster
    # Musc21 Tim
    "black>=25.12.0",
    "numba>=0.63.1",
    "tabulate>=0.9.0",
    "pandas-stubs~=2.3.3",
    "sentence-transformers>=5.2.3",
    "pytest>=9.0.2",
    "hydra-optuna-sweeper>=1.2",
    "sqlalchemy<2.0.0",
    "lxml==6.0.2",
    "more-itertools==10.8.0",
#    "muster@git+https://github.com/TimFelixBeyer/amtevaluation.github.io.git",  # git@github.com:TimFelixBeyer/amtevaluation.github.io.git
    #    "score-transformer",
    "music21@git+https://github.com/TimFelixBeyer/music21.git@0ed70bb38f2017dc04cb19aada24e88a141517e2",
    "optuna>=2.10.1",
    "partitura==1.7.*",
    "alembic>=1.18.4",
    "sqlalchemy<2.0.0",
    "hydra-joblib-launcher>=1.2.0",
    "optuna-dashboard>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
skip-string-normalization = true

[tool.isort]
profile = "black"
filter_files = true

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.uv.sources]
muster = { path = "../metrics/amtevaluation.github.io" }
score-transformer = { path = "../metrics/ScoreTransformer" }
music21 = { git = "https://github.com/TimFelixBeyer/music21.git", rev = "0ed70bb38f2017dc04cb19aada24e88a141517e2" }
partitura = { path = "../../../Applications/partitura" }
