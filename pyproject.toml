[project]
name = "gramscore"
version = "0.0.1"
description = "Describe Your Cool Project"
authors = [
    { name = "Léo Géré", email = "leleogere@gmail.com" }
]
urls = { "Homepage" = "https://github.com/leleogere/gramscore" }
dependencies = [
#    'Pillow',
#    'accelerate',
#    'bitsandbytes',
#    'cairosvg',
    'python-dotenv',
    'einops',
    'hydra-colorlog>=1.2.0',
    'hydra-core>=1.3.2',
    'joblib',
    'lightning>=2.0.0',
    'loguru',
    'matplotlib',
    'pandas',
    'partitura @ git+https://github.com/leleogere/partitura.git@develop_perso',
#    'peft',
    'positional-encodings',
    'rich',
#    'sentencepiece',
    'symusic',
    'torch>=2.0.0',
    'torchmetrics>=0.11.4',
#    'torchvision>=0.15.0',
    'tqdm',
    'transformers',
    'verovio',
    'wandb',
    'wandb-osh'
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
skip-string-normalization = true

[tool.isort]
profile = "black"
filter_files = true

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"
