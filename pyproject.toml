[project]
name = "gramscore"
version = "0.0.1"
description = "Describe Your Cool Project"
authors = [
    { name = "Léo Géré", email = "leleogere@gmail.com" }
]
urls = { "Homepage" = "https://github.com/leleogere/gramscore" }
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchmetrics>=0.11.4",
    "lightning>=2.0.0",
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "loguru",
    "wandb",
    "sentencepiece",
    "transformers",
    "peft",
    "bitsandbytes",
    "accelerate",
    "partitura @ git+https://github.com/leleogere/partitura.git@main_patched",  # custom version, merge PRs 384, 387, 390, 392
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
]

[tool.black]
line-length = 100
target-version = ['py312']
skip-string-normalization = true

[tool.isort]
profile = "black"
filter_files = true

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"
